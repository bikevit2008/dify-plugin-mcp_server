version: 1.0.0
type: plugin
author: hjlarry
name: mcp-server
label:
  en_US: MCP Tool Export
  ru_RU: Экспорт как MCP-инструмент
description:
  en_US: Expose Dify workflows and chat apps as MCP tools. Supports multi-tool, version negotiation, SSE/Streamable HTTP, and all MCP methods. Compatible with Devin, Windsurf, Claude Code, Cursor, OpenCode, and any MCP client.
  zh_Hans: 将Dify工作流或对话流作为MCP工具暴露。支持多工具、版本协商、SSE/Streamable HTTP及所有MCP方法。兼容Devin、Windsurf、Claude Code、Cursor、OpenCode及任何MCP客户端。
  ru_RU: Экспорт Dify-воркфлоу и чат-приложений как MCP-инструментов. Поддержка multi-tool, версионных переговоров, SSE/Streamable HTTP и всех MCP-методов. Совместим с Devin, Windsurf, Claude Code, Cursor, OpenCode и любыми MCP-клиентами.
icon: icon.svg
resource:
  memory: 268435456
  permission:
    endpoint:
      enabled: true
    app:
      enabled: true
    storage:
      enabled: true
      size: 1048576
plugins:
  endpoints:
    - group/mcp-server.yaml
meta:
  version: 1.0.0
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: 1.3.0
created_at: 2025-03-17T16:01:01.118569+08:00
privacy: PRIVACY.md
verified: false
